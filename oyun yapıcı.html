<script>
/* ===== OYUN MOTORU (editörden ayrı; dışa aktarılan oyuna da gömülür) ===== */
function drawObj(c,o,im){
 if(!o.vis)return;const w=o.w,h=o.h;
 c.save();c.translate(o.x+w/2,o.y+h/2);c.rotate(o.rot*Math.PI/180);c.scale(o.sc,o.sc);c.fillStyle=o.color;
 switch(o.type){
  case'rect':c.fillRect(-w/2,-h/2,w,h);break;
  case'circle':c.beginPath();c.ellipse(0,0,w/2,h/2,0,0,7);c.fill();break;
  case'tri':c.beginPath();c.moveTo(0,-h/2);c.lineTo(w/2,h/2);c.lineTo(-w/2,h/2);c.fill();break;
  case'poly':c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;c[i?'lineTo':'moveTo'](Math.cos(a)*w/2,Math.sin(a)*h/2)}c.fill();break;
  case'text':c.font='bold '+h+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(o.disp===undefined?o.text:o.disp,0,0);break;
  case'img':case'sprite':{const i=im[o.img];if(i&&i.naturalWidth){const n=o.type==='sprite'?Math.max(1,o.fr|0):1,fw=i.naturalWidth/n;c.drawImage(i,(o._f||0)*fw,0,fw,i.naturalHeight,-w/2,-h/2,w,h)}else{c.strokeStyle='#888';c.strokeRect(-w/2,-h/2,w,h)}}break;
 }
 c.restore();
}
function GX(P,cv,host){
 const c=cv.getContext('2d'),im={},keys={},kd={},clk=[],W=[],V={},cam={x:0,y:0};
 let S,run=0,tk=0,T=0,DT=.016,fr=0,t0=0,raf=0,fa=0,fc=0,hk={s:[],u:[]};
 const say=m=>host&&host(m),err=m=>say({t:'err',m:String(m)}),clone=x=>JSON.parse(JSON.stringify(x));

 const beep=(f,d)=>{try{const a=GX.ac=GX.ac||new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();d=d||.15;o.frequency.value=f||440;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}};
 const bx=o=>{const w=o.w*o.sc,h=o.h*o.sc;return{l:o.x+o.w/2-w/2,t:o.y+o.h/2-h/2,w:w,h:h}};
 const hit=(a,b)=>{a=bx(a);b=bx(b);return a.l<b.l+b.w-.01&&a.l+a.w>b.l+.01&&a.t<b.t+b.h-.01&&a.t+a.h>b.t+.01};
 const find=n=>S.objs.find(o=>o.name===n),sub=(k,s)=>k.o?find(k.o):s,wt=s=>new Promise(r=>W.push([T+s,r]));
 const cd=(k,s)=>{const t=sub(k,s);switch(k.ct){
  case'start':return fr===0;case'every':return true;
  case'click':return!!t&&clk.includes(t);
  case'keydown':return!!kd[k.a];case'key':return!!keys[k.a];
  case'touch':{const u=find(k.a);return!!(t&&u&&t!==u&&t.vis&&u.vis&&hit(t,u))}
  case'var':{const v=+V[k.a]||0,b=+k.b||0;return k.c==='>'?v>b:k.c==='<'?v<b:v===b}}
  return false};
 const ex=async(st,s,tok)=>{const t=sub(st,s),n=+st.a||0;
  switch(st.t){
  case'mx':t&&(t.x+=n*DT*60);break;case'my':t&&(t.y+=n*DT*60);break;
  case'go':t&&(t.x=n,t.y=+st.b||0);break;
  case'vx':t&&(t.vx=n);break;case'vy':t&&(t.vy=n);break;
  case'jump':t&&t.gr&&(t.vy=-n);break;case'rot':t&&(t.rot+=n);break;
  case'show':t&&(t.vis=1);break;case'hide':t&&(t.vis=0);break;
  case'col':t&&(t.color=st.a);break;case'txt':t&&(t.text=st.a);break;case'size':t&&(t.sc=n);break;
  case'del':t&&(S.objs=S.objs.filter(x=>x!==t));break;
  case'wait':await wt(n);break;
  case'rep':for(let i=0;i<n&&tok===tk;i++){await rl(st.k,s,tok);await wt(0)}break;
  case'fo':while(tok===tk&&run){await rl(st.k,s,tok);await wt(0)}break;
  case'if':if(cd(st,s))await rl(st.k,s,tok);break;
  case'scn':load(st.a);break;case'stop':stop();break;
  case'vset':V[st.a]=+st.b||0;break;case'vadd':V[st.a]=(+V[st.a]||0)+(+st.b||0);break;
  case'vrnd':{const a=+st.b||0,b=+st.c||0;V[st.a]=Math.floor(Math.min(a,b)+Math.random()*(Math.abs(b-a)+1))}break;
  case'snd':beep(n,+st.b)}};
 const rl=async(L,s,tok)=>{for(const st of L){if(tok!==tk||!run||(s&&!S.objs.includes(s)))return;await ex(st,s,tok)}};
 const load=n=>{const sc=P.scenes.find(x=>x.name===n)||P.scenes[0];S=clone(sc);S.objs.forEach(o=>{o.vx=o.vy=0;o._t=0;o.gr=0});cv.width=S.vw||S.w;cv.height=S.vh||S.h;tk++;fr=0};
 const update=dt=>{DT=dt;T+=dt;for(const w of W.splice(0))w[0]<=T?w[1]():W.push(w);
  for(const o of S.objs){
   if(o.type==='sprite'&&o.fr>1){o._t+=dt;o._f=Math.floor(o._t*(o.fps||8))%o.fr}
   if(o.g)o.vy+=(P.grav||0)*dt;
   if(o.vx||o.vy){
    o.x+=o.vx*dt;for(const s of S.objs)if(s!==o&&s.solid&&s.vis&&o.vx&&hit(o,s)){const a=bx(o),b=bx(s);o.x+=o.vx>0?b.l-a.l-a.w:b.l+b.w-a.l;o.vx=0}
    o.gr=0;o.y+=o.vy*dt;for(const s of S.objs)if(s!==o&&s.solid&&s.vis&&o.vy&&hit(o,s)){const a=bx(o),b=bx(s);if(o.vy>0){o.y+=b.t-a.t-a.h;o.gr=1}else o.y+=b.t+b.h-a.t;o.vy=0}}
  }
  for(const o of S.objs.slice())for(const s of o.bl||[])if(!s._r&&cd({ct:s.h,o:'',a:s.a},o)){s._r=1;rl(s.k,o,tk).then(()=>{s._r=0}).catch(err)}
  for(const e of P.ev||[])if(!e._r&&e.c.every(k=>cd(k,null))){e._r=1;rl(e.a,null,tk).then(()=>{e._r=0}).catch(err)}
  hk.u.forEach(f=>{try{f(dt)}catch(x){err(x.message)}});fr++};
 const render=()=>{const f=S.cam&&find(S.cam);
  if(f){cam.x=Math.max(0,Math.min(S.w-cv.width,f.x+f.w/2-cv.width/2));cam.y=Math.max(0,Math.min(S.h-cv.height,f.y+f.h/2-cv.height/2))}else cam.x=cam.y=0;
  c.fillStyle=S.bg;c.fillRect(0,0,cv.width,cv.height);c.save();c.translate(-Math.round(cam.x),-Math.round(cam.y));
  S.objs.map((o,i)=>[o,i]).sort((a,b)=>a[0].z-b[0].z||a[1]-b[1]).forEach(([o])=>{if(o.type==='text')o.disp=String(o.text).replace(/\{([^{}]+)\}/g,(m,k)=>V[k]===undefined?0:V[k]);drawObj(c,o,im)});c.restore()};
 const frame=ts=>{if(!run)return;const dt=Math.min((ts-t0)/1000||0,.05);t0=ts;fa+=dt;fc++;if(fa>=.5){say({t:'fps',v:Math.round(fc/fa)});fa=fc=0}
  try{update(dt);render()}catch(e){err(e.message)}
  for(const k in kd)delete kd[k];clk.length=0;raf=requestAnimationFrame(frame)};
 const stop=()=>{run=0;cancelAnimationFrame(raf)};
 addEventListener('keydown',e=>{if(!keys[e.code])kd[e.code]=1;keys[e.code]=1;if(/^(Arrow|Space)/.test(e.code))e.preventDefault()});
 addEventListener('keyup',e=>{keys[e.code]=0});
 cv.addEventListener('pointerdown',e=>{if(!run)return;focus();const r=cv.getBoundingClientRect(),s=Math.min(r.width/cv.width,r.height/cv.height),x=(e.clientX-r.left-(r.width-cv.width*s)/2)/s+cam.x,y=(e.clientY-r.top-(r.height-cv.height*s)/2)/s+cam.y;
  const hs=S.objs.filter(o=>{const b=bx(o);return o.vis&&o.type!=='empty'&&x>=b.l&&x<=b.l+b.w&&y>=b.t&&y<=b.t+b.h}).sort((a,b)=>b.z-a.z);if(hs[0])clk.push(hs[0])});
 if(matchMedia('(pointer:coarse)').matches)[['◀','ArrowLeft','left:8px;bottom:16px'],['▶','ArrowRight','left:140px;bottom:16px'],['▲','ArrowUp','left:74px;bottom:80px'],['▼','ArrowDown','left:74px;bottom:16px'],['●','Space','right:16px;bottom:40px']].forEach(([t,k,p])=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='position:fixed;width:58px;height:58px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:22px;touch-action:none;user-select:none;'+p;b.onpointerdown=e=>{e.preventDefault();keys[k]=kd[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{keys[k]=0};document.body.appendChild(b)});
 const start=()=>{Object.assign(V,clone(P.vars||{}));hk={s:[],u:[]};load(P.scenes[0].name);
  const api={obj:find,var:(n,v)=>v===undefined?V[n]:(V[n]=v),scene:load,touching:(a,b)=>{a=find(a);b=find(b);return!!(a&&b&&hit(a,b))},key:k=>!!keys[k],beep,stop,
   move:(n,x,y)=>{const o=find(n);if(o){o.x+=x;o.y+=y}},setPos:(n,x,y)=>{const o=find(n);if(o){o.x=x;o.y=y}}};
  try{window.USERJS&&window.USERJS(api,f=>hk.s.push(f),f=>hk.u.push(f))}catch(e){err(e.message)}
  run=1;t0=performance.now();hk.s.forEach(f=>{try{f()}catch(e){err(e.message)}});raf=requestAnimationFrame(frame)};

}

const ST={
mx:[1,'Yatay hareket (px)',[['o','o'],['a','n',5]]],my:[1,'Dikey hareket (px)',[['o','o'],['a','n',5]]],
go:[1,'Konuma git (x, y)',[['o','o'],['a','n'],['b','n']]],vx:[1,'Yatay hız ata',[['o','o'],['a','n',200]]],vy:[1,'Dikey hız ata',[['o','o'],['a','n']]],
jump:[1,'Zıpla (yerdeyse)',[['o','o'],['a','n',450]]],rot:[1,'Döndür (derece)',[['o','o'],['a','n',5]]],
show:[2,'Göster',[['o','o']]],hide:[2,'Gizle',[['o','o']]],col:[2,'Renk ata',[['o','o'],['a','x','#ff5577']]],

let P,ci=0,sel=null,TB='b',U=[],R=[],last='',zm=1,pan={x:0,y:0},K=1,OX=0,OY=0,drag=null,dirty=0,saveT,IM={};

const mkObj=(t,x,y)=>({id:uid(),name:OT[t]+' '+(++P.n),type:t,x,y,w:t==='text'?160:80,h:t==='text'?32:80,rot:0,sc:1,z:0,vis:1,lock:0,color:t==='text'?'#ffffff':'#5b8cff',text:'Metin',img:'',fr:1,fps:8,g:0,solid:0,bl:[]});
